apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-saludo-deployment
  labels:
    app: app-saludo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-saludo

  template:
    metadata:
      labels:
        app: app-saludo

    spec:
      containers:
        - name: app-saludo
          image: pilarbaquerizo/mi-app-evaluacion:latest5
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-saludo-service
spec:
  type: LoadBalancer
  selector:
    app: app-saludo
  ports:
    - port: 80        # Puerto expuesto por el Service
      targetPort: 8080  # Puerto dentro del contenedor
